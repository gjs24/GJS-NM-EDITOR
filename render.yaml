# ==============================================================================
# Render Infrastructure Blueprint for GJS Railway Board Studio Backend
# ==============================================================================
# Docs: https://render.com/docs/blueprint-spec

services:
  - type: web
    name: gjs-railway-backend
    env: node
    plan: free
    region: singapore # Closest free region to India for low latency
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: FRONTEND_URL
        sync: false # Set to your Vercel URL in Render dashboard
      - key: SUPABASE_URL
        sync: false # Set to your Supabase project URL
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false # Set to your Supabase service role key
      - key: CASHFREE_APP_ID
        sync: false # Set to your Cashfree App ID
      - key: CASHFREE_SECRET_KEY
        sync: false # Set to your Cashfree Secret Key
      - key: CASHFREE_ENV
        value: sandbox

